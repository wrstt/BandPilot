name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    # The layout tests target plain net8.0 on purpose, so the cheap check that
    # guards the native struct definitions runs without a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run layout and math checks
        run: dotnet run -c Release --project tests/LayoutTests/LayoutTests.csproj

      # WPF resolves StaticResource at runtime, so a mistyped key builds fine
      # and throws on first show. The compiler cannot catch it and neither can
      # the Windows build job, so it is checked statically here.
      - name: Verify WPF resource keys resolve
        run: python3 tools/check-resources.py

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file executable
        run: >
          dotnet publish src/BandPilot.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: BandPilot-win-x64
          path: dist/BandPilot.exe
          if-no-files-found: error
